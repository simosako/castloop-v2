name: Build and release Linux CLI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: npm ci
      - run: npm run check
      - name: Prepare private test workspace
        run: mkdir -p -m 700 /tmp/opencode
      - run: bun test
      - name: Verify tag version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Build Linux x86-64 release binary
        shell: bash
        run: |
          npm run build:cli -- linux-x64
          cp THIRD_PARTY_NOTICES.md dist/
          cp LICENSE dist/
          cd dist
          sha256sum castloop-linux-x64 > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: castloop-linux-x64
          path: |
            dist/castloop-linux-x64
            dist/SHA256SUMS
            dist/THIRD_PARTY_NOTICES.md
            dist/LICENSE
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: castloop-linux-x64
          path: dist
      - name: Verify binary and CLI entrypoint
        shell: bash
        run: |
          expected_version="$(node -p "require('./package.json').version")"
          cd dist
          sha256sum --check SHA256SUMS
          chmod +x castloop-linux-x64
          test "$(./castloop-linux-x64 --version)" = "$expected_version"
          ./castloop-linux-x64 --help | grep -F 'Usage: castloop'
          for command in init create-show create-episode update-show publish-show update-episode update-episode-audio publish-episode job-status service-status show-status show-pause show-resume deploy init-continue-verification update-service-verify update-service-reconcile preview-show-lifecycle preview-episode-lifecycle lifecycle-execute list-shows list-episodes import-rss publish-rss-import; do
            ./castloop-linux-x64 "$command" --help | grep -F "Usage: castloop $command"
          done
          ./castloop-linux-x64 init --help | grep -F 'no protocol option is required'
          ./castloop-linux-x64 init --help | grep -F 'schema_version=2'
          if ./castloop-linux-x64 list-episodes > list-episodes-error.txt 2>&1; then
            exit 1
          fi
          grep -F 'Usage: castloop list-episodes SHOW_ID' list-episodes-error.txt
          for command in domain retry-job release-job lifecycle-retry update-service-continue local-operation-status service-pause service-resume; do
            if ./castloop-linux-x64 "$command" --help > removed-command-error.txt 2>&1; then
              exit 1
            fi
            grep -F 'Unknown command' removed-command-error.txt
          done
          binary="$PWD/castloop-linux-x64"
          mkdir rejected-workspace
          cd rejected-workspace
          echo 'schema_version = 1' > castloop.toml
          for command in init deploy service-status; do
            if "$binary" "$command" > rejected-error.txt 2>&1; then
              exit 1
            fi
            grep -F 'use a compatible v0.5.x CLI/Worker' rejected-error.txt
            test ! -e .castloop
            test "$(cat castloop.toml)" = 'schema_version = 1'
          done
          cd ..
          if ./castloop-linux-x64 import-rss > import-rss-error.txt 2>&1; then
            exit 1
          fi
          grep -F 'Usage: castloop import-rss SHOW_ID FEED_URL' import-rss-error.txt
          if ./castloop-linux-x64 publish-rss-import > publish-rss-import-error.txt 2>&1; then
            exit 1
          fi
          grep -F 'Usage: castloop publish-rss-import DIRECTORY' publish-rss-import-error.txt

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: castloop-linux-x64
          path: dist
      - name: Publish Linux release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" castloop-linux-x64 SHA256SUMS THIRD_PARTY_NOTICES.md LICENSE \
            --repo "$GITHUB_REPOSITORY" --title "castloop $GITHUB_REF_NAME" \
            --notes-file "../docs/release-${GITHUB_REF_NAME}.md"
