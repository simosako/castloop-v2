# Field reference for <show_id>/show.toml.
# Start with create-show, keep its show_id, and fill in your podcast information.
schema_version = 1
show_id = "samplepodcast"
title = "Sample Podcast"
description = "サンプルのポッドキャスト"
language = "ja"
author = "Taro Yamada"
owner_name = "Taro Yamada"
owner_email = "owner@example.com"
categories = ["Technology"]
explicit = false
site_mode = "builtin"
image_path = "cover.jpg"

